name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Run source audit
        run: npm run audit:source

      - name: Run Arena Security 100 source checks
        run: npm run security:arena100

      - name: Check lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Install Chromium for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run critical-flow end-to-end tests
        run: npx playwright test

      - name: Upload Arena browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit locked dependencies for high and critical vulnerabilities
        run: npm audit --audit-level=high
