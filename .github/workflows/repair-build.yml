name: Manual read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source, lint, tests, and build checks (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run source audit
        run: npm run audit:source
      - name: Run Arena Security 100 source checks
        run: npm run security:arena100

      - name: Check lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application for verification
        run: npm run build
