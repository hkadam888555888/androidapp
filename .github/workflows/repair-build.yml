name: Dispatch verification and Android APK checks

on:
  workflow_dispatch:

# This workflow only dispatches the normal read-only checks. It must never
# modify source files or push commits to the default branch.
permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verification and Android APK workflows on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in verify.yml android-apk.yml; do
            response_file="$(mktemp)"
            trap 'rm -f "$response_file"' EXIT
            code="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data '{"ref":"main"}')"
            printf '%s dispatch returned HTTP %s\n' "$workflow" "$code"
            if [[ "$code" != "204" ]]; then cat "$response_file"; exit 1; fi
          done
